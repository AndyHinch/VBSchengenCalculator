name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Install MAUI workloads
      run: |
        dotnet workload install maui-android
        dotnet workload install maui-ios
        dotnet workload install maui-maccatalyst
        dotnet workload install maui-windows
        
    - name: Restore dependencies
      run: dotnet restore ./VBSCalc.sln
      
    - name: Build Blazor WebAssembly
      run: dotnet build blazor-app/SchengenCalculator.csproj --configuration Release --no-restore
      
    - name: Build Core Library
      run: dotnet build src/SchengenCalculator.Core/SchengenCalculator.Core.csproj --configuration Release --no-restore
      
    - name: Build API
      run: dotnet build src/SchengenCalculator.Api/SchengenCalculator.Api.csproj --configuration Release --no-restore
      
    - name: Build MAUI (Android)
      run: dotnet build src/SchengenCalculator.Maui/SchengenCalculator.Maui.csproj -f net9.0-android --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test tests/SchengenCalculator.Tests.csproj --configuration Release --no-build --verbosity normal
      
    - name: Publish Blazor WebAssembly
      run: dotnet publish blazor-app/SchengenCalculator.csproj --configuration Release --output ./publish/blazor
      
    - name: Upload Blazor artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blazor-app
        path: ./publish/blazor/wwwroot
