name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  validate-non-maui:
    name: Validate Non-MAUI Projects
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore solution (excludes MAUI)
      run: dotnet restore VBSCalc.sln
      
  build-and-test:
    name: Build and Test (Non-MAUI)
    needs: validate-non-maui
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore solution
      run: dotnet restore VBSCalc.sln
      
    - name: Build solution
      run: dotnet build VBSCalc.sln --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test VBSCalc.sln --configuration Release --no-build --verbosity normal
      
    - name: Publish Blazor WebAssembly
      run: dotnet publish blazor-app/SchengenCalculator.csproj --configuration Release --output ./publish/blazor
      
    - name: Upload Blazor artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blazor-app
        path: ./publish/blazor/wwwroot

  build-maui:
    name: Build MAUI (Windows)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Install MAUI workloads
      run: dotnet workload install maui --skip-sign-check
      
    - name: Restore MAUI project
      run: dotnet restore src/SchengenCalculator.Maui/SchengenCalculator.Maui.csproj
      
    - name: Build MAUI (Android)
      run: dotnet build src/SchengenCalculator.Maui/SchengenCalculator.Maui.csproj -f net9.0-android --configuration Release --no-restore
      
    - name: Build MAUI (Windows)
      run: dotnet build src/SchengenCalculator.Maui/SchengenCalculator.Maui.csproj -f net9.0-windows10.0.19041.0 --configuration Release --no-restore
