name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Projects
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET with MAUI
      uses: ./.github/actions/setup-dotnet-maui
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore and validate solution
      run: dotnet restore ./VBSCalc.sln
      
  build:
    name: Build and Test
    needs: validate
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET with MAUI
      uses: ./.github/actions/setup-dotnet-maui
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore ./VBSCalc.sln
      
    - name: Build solution
      run: dotnet build ./VBSCalc.sln --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test tests/SchengenCalculator.Tests.csproj --configuration Release --no-build --verbosity normal
      
    - name: Publish Blazor WebAssembly
      run: dotnet publish blazor-app/SchengenCalculator.csproj --configuration Release --output ./publish/blazor
      
    - name: Upload Blazor artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blazor-app
        path: ./publish/blazor/wwwroot
