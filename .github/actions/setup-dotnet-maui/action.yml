name: 'Setup .NET with MAUI'
description: 'Setup .NET SDK and install MAUI workloads'
inputs:
  dotnet-version:
    description: '.NET SDK version to install'
    required: false
    default: '9.0.x'
runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    
    - name: Install MAUI workloads
      shell: bash
      run: |
        dotnet workload install maui --skip-sign-check || dotnet workload install maui-android maui-ios maui-maccatalyst maui-windows --skip-sign-check
