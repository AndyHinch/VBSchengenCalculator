name: 'Setup .NET with MAUI'
description: 'Setup .NET SDK and install MAUI workloads (Windows only)'
inputs:
  dotnet-version:
    description: '.NET SDK version to install'
    required: false
    default: '9.0.x'
runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    
    - name: Check if Windows
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "Windows" ]; then
          echo "?? WARNING: MAUI workloads are only supported on Windows runners."
          echo "This action should only be used on windows-latest or windows-* runners."
          exit 1
        fi
    
    - name: Install MAUI workloads
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        dotnet workload install maui --skip-sign-check
